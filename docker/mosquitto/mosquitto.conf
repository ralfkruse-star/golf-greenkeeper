# Mosquitto MQTT Broker Configuration for Golf Greenkeeper

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Allow anonymous connections (for development)
# In production, use authentication with password file
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Connection settings
max_connections -1
max_keepalive 65535

# Message settings
max_queued_messages 1000
message_size_limit 0

# Security (uncomment for production)
# allow_anonymous false
# password_file /mosquitto/config/password.txt
# acl_file /mosquitto/config/acl.txt

# WebSocket settings
# websockets_log_level 255

# Authentication Plugin (optional)
# auth_plugin /usr/lib/mosquitto_auth_plugin.so
